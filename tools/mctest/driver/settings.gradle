// Test driver for tools/mctest. A build of its own, so the release build (root settings.gradle)
// never sees it and nothing of it can reach upload/. Build with the root wrapper:
//   ./gradlew -p tools/mctest/driver build
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mctest-driver'

include 'neoforge-1.21.1'
include 'forge-1.20.1'
include 'fabric-1.21.1'
include 'fabric-1.21.11'
include 'fabric-26.1.2'
include 'fabric-26.2'
