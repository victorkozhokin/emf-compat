plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases"
    }
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// Picks up an unreleased EMF / ETF jar from <repo>/libs, newest name last, or null when the
// folder holds none. Kept as a plain lookup so a clean checkout without the jars still builds.
def betaJar = { String prefix ->
    def matches = rootProject.file('libs').listFiles()
            ?.findAll { it.name.startsWith(prefix) && it.name.endsWith('.jar') }
            ?.sort { it.name }
    if (!matches) return null
    def jar = matches.last()
    logger.lifecycle("${project.name}: building against ${jar.name} from libs/")
    return jar
}
def emfBetaJar = betaJar('entity_model_features-')
def etfBetaJar = betaJar('entity_texture_features-')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly fabricApi.module("fabric-api-base", project.fabric_version)
    compileOnly fabricApi.module("fabric-data-generation-api-v1", project.fabric_version)
    compileOnly fabricApi.module("fabric-renderer-api-v1", project.fabric_version)
    compileOnly fabricApi.module("fabric-model-loading-api-v1", project.fabric_version)

    // Unreleased EMF / ETF builds dropped into <repo>/libs take precedence over the pinned
    // Modrinth releases, so the core can be built against API that is not published yet.
    // See libs/README.md; with the folder empty this falls back to the releases below.
    if (emfBetaJar != null) {
        compileOnly files(emfBetaJar)
    } else {
        compileOnly "maven.modrinth:entity-model-features:${emf_version}-fabric-${minecraft_version}"
    }
    if (etfBetaJar != null) {
        compileOnly files(etfBetaJar)
    } else {
        compileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-fabric-${minecraft_version}"
    }
    // Optional: the settings screen is reached through Mod Menu. Compile-only, so the
    // core works without it — there is just no button in the mod list.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_description", mod_description
    inputs.property "mod_authors", mod_authors
    inputs.property "mod_license", mod_license
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
                "version"          : version,
                "minecraft_version": minecraft_version,
                "loader_version"   : loader_version,
                "mod_id"           : mod_id,
                "mod_name"         : mod_name,
                "mod_description"  : mod_description,
                "mod_authors"      : mod_authors,
                "mod_license"      : mod_license,
                "emf_version"      : emf_version
        ])
    }
}

def targetJavaVersion = project.hasProperty('target_java_version') ? target_java_version.toInteger() : 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
