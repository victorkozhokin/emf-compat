plugins {
    id 'base'
}

// Root aggregator for the multi-loader EMF compatibility project.
//
// Layout:
//   core/<loader>/<version>               — shared EMF compatibility framework.
//   extensions/create/<loader>/<version>  — Create addon (Create on NeoForge / Create Fly on Fabric).
//   extensions/nea/<loader>/<version>     — NotEnoughAnimations addon.
//   extensions/carryon/<loader>/<version> — Carry On addon.

// Stonecutter branch roots are controller projects, not buildable ones — applying `base` to
// them makes Stonecutter complain and serves no purpose, since the jars come out of the version
// nodes underneath.
def stonecutterBranchRoots = [':better-combat-fabric'] as Set

allprojects {
    if (!(project.path in stonecutterBranchRoots)) {
        apply plugin: 'base'
    }

    group = mod_group_id
    version = mod_version

    repositories {
        mavenLocal()
    }

    afterEvaluate { p ->
        if (p == rootProject) return
        if (p.path in stonecutterBranchRoots) return

        def modId = p.findProperty('mod_id')
        def mcVersion = p.findProperty('minecraft_version')
        def modVersion = p.findProperty('mod_version')
        def modSuffix = (modId != null && modId.startsWith('emf_compat_')) ? modId.substring('emf_compat_'.length()) : null
        // A mod of its own in this repository (Touch'n Motion) keeps its id as the jar's and the icon's name, with no prefix.
        def standalone = modId != null && modId in ['touch_n_motion']

        def uploadElement
        def uploadLoader
        def uploadVersion

        // Flat modules are named "<element>-<loader>-<version>". A Stonecutter version node is
        // named after its Minecraft version alone and hangs under a branch named
        // "<element>-<loader>", so the same three pieces come from the parent plus the node.
        def nameParts
        if (p.parent != null && p.parent != rootProject) {
            nameParts = (p.parent.name.split('-') as List) + [p.name]
        } else {
            nameParts = p.name.split('-') as List
        }

        if (nameParts.size() >= 3) {
            uploadLoader = nameParts[-2]
            uploadVersion = nameParts[-1]
            def elementParts = nameParts[0..-3]

            // Use the user-facing mod name (without the "EMF Compat: " prefix) when available,
            // so multi-word extension names like "Immersive Melodies" become a single folder.
            def modName = p.findProperty('mod_name')
            if (modName != null) {
                def prefix = 'EMF Compat: '
                uploadElement = modName.startsWith(prefix) ? modName.substring(prefix.length()) : modName
            } else {
                uploadElement = elementParts.collect { it.capitalize() }.join(' ')
            }
        } else {
            return
        }

        p.tasks.register('copyToUpload', Copy) {
            def jarTask = p.tasks.findByName('reobfJar') ?: p.tasks.findByName('remapJar') ?: p.tasks.jar
            def uploadDir = rootProject.file("upload/${uploadElement}/${uploadLoader}/${uploadVersion}")
            doFirst {
                project.delete project.fileTree(uploadDir).matching { include '*.jar' }
            }
            from jarTask.archiveFile
            into uploadDir

            if (modSuffix != null && mcVersion != null && modVersion != null) {
                rename { "emf_compat_${modSuffix}_${uploadLoader}_${mcVersion}_${modVersion}.jar" }
            } else if (standalone && mcVersion != null && modVersion != null) {
                rename { "${modId}_${uploadLoader}_${mcVersion}_${modVersion}.jar" }
            }
        }

        p.tasks.build.finalizedBy('copyToUpload')

        // Mixin configs are only looked up when the game starts, so a config that never made it
        // into the jar builds fine and then crashes the loader on launch. NEA Fabric 1.21.1 shipped
        // exactly like that. Check the finished jar instead of the sources: it is what the loader
        // reads, with every template already expanded.
        def verifyMixins = p.tasks.register('verifyMixinConfigs') {
            group = 'verification'
            description = 'Checks that every mixin config the mod metadata names is in the jar, with its classes.'
            def jarTask = p.tasks.findByName('reobfJar') ?: p.tasks.findByName('remapJar') ?: p.tasks.jar
            dependsOn jarTask
            def jarFile = jarTask.archiveFile
            inputs.file(jarFile)
            def marker = p.layout.buildDirectory.file('verifyMixinConfigs.ok')
            outputs.file(marker)
            doLast {
                verifyMixinConfigsIn(jarFile.get().asFile, p.path, p.logger)
                def out = marker.get().asFile
                out.parentFile.mkdirs()
                out.text = 'ok'
            }
        }
        p.tasks.named('check') { dependsOn verifyMixins }
        // A jar that would crash the loader must never reach the upload folder.
        p.tasks.named('copyToUpload') { dependsOn verifyMixins }

        if (modSuffix != null || standalone) {
            def iconSource = rootProject.file(standalone ? "resources/icons/icon_${modId}.png" : "resources/icons/icon_emf_compat_${modSuffix}.png")
            if (iconSource.exists()) {
                def processResources = p.tasks.findByName('processResources')
                if (processResources instanceof ProcessResources) {
                    processResources.from(iconSource) {
                        into '.'
                        rename { 'icon.png' }
                    }
                }
            }
        }
    }
}

/**
 * Reads the mod metadata inside a built jar and fails if any mixin config it names is missing,
 * is not valid JSON, or lists a mixin class the jar does not contain. Covers all three loaders:
 * fabric.mod.json, [[mixins]] blocks in neoforge.mods.toml / mods.toml, and the MixinConfigs
 * manifest attribute Forge 1.20.1 uses. A refmap that is named but absent fails the build only for
 * Forge 1.20.1, the one runtime here that renames classes at launch; elsewhere it is harmless.
 */
def verifyMixinConfigsIn(File jar, String projectPath, org.gradle.api.logging.Logger logger) {
    def zip = new java.util.jar.JarFile(jar)
    try {
        def has = { String name -> zip.getEntry(name) != null }
        def read = { String name -> zip.getInputStream(zip.getEntry(name)).getText('UTF-8') }

        Set<String> configs = new LinkedHashSet<>()
        if (has('fabric.mod.json')) {
            def meta = new groovy.json.JsonSlurper().parseText(read('fabric.mod.json'))
            (meta.mixins ?: []).each { configs << (it instanceof String ? it : it.config) }
        }
        ['META-INF/neoforge.mods.toml', 'META-INF/mods.toml'].findAll { has(it) }.each { toml ->
            boolean inMixins = false
            read(toml).eachLine { line ->
                def trimmed = line.trim()
                if (trimmed.startsWith('[')) inMixins = (trimmed == '[[mixins]]')
                def m = inMixins ? (trimmed =~ /^config\s*=\s*"([^"]+)"/) : null
                if (m) configs << m[0][1]
            }
        }
        // Forge 1.20.1 is the only runtime here that renames classes (to SRG) at launch, which
        // is what makes a refmap mandatory.
        boolean forgeRuntime = has('META-INF/mods.toml') && !has('META-INF/neoforge.mods.toml')
        def manifestConfigs = zip.manifest?.mainAttributes?.getValue('MixinConfigs')
        manifestConfigs?.split(',')*.trim()?.findAll { it }?.each { configs << it }

        def errors = []
        configs.each { config ->
            if (!has(config)) {
                errors << "mixin config '${config}' is named by the metadata but is not in the jar"
                return
            }
            def json
            try {
                json = new groovy.json.JsonSlurper().parseText(read(config))
            } catch (Exception e) {
                errors << "mixin config '${config}' is not valid JSON: ${e.message}"
                return
            }
            def pkg = (json.package ?: '').replace('.', '/')
            ['mixins', 'client', 'server'].each { side ->
                (json[side] ?: []).each { String name ->
                    def cls = "${pkg}/${name.replace('.', '/')}.class"
                    if (!has(cls)) errors << "mixin config '${config}' lists ${side} mixin '${name}', but ${cls} is not in the jar"
                }
            }
            if (json.refmap && !has(json.refmap)) {
                if (forgeRuntime) {
                    errors << "mixin config '${config}' names refmap '${json.refmap}', which is not in the jar — " +
                            "Forge 1.20.1 runs on SRG names, so without it every injection misses its target"
                } else {
                    // NeoForge runs on Mojang names and Loom rewrites Fabric targets in the bytecode,
                    // so neither needs the file; Mixin just notes its absence.
                    logger.info("${projectPath}: mixin config '${config}' names refmap '${json.refmap}', which is not in the jar (not needed here)")
                }
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("${projectPath}: ${jar.name} would fail to launch:\n  - " + errors.join('\n  - '))
        }
        logger.info("${projectPath}: ${configs.size()} mixin config(s) verified in ${jar.name}")
    } finally {
        zip.close()
    }
}

// Personal Aeronautics pack assembly (NeoForge 1.21.1 only).
tasks.register('copyToAeronautics', Copy) {
    group = 'build'
    description = 'Assembles the Aeronautics NeoForge 1.21.1 pack into upload/Aeronautics/neoforge-1.21.1'

    def aeronauticsModules = [
        ':core-neoforge-1.21.1',
        ':quark-neoforge-1.21.1',
        ':supplementaries-neoforge-1.21.1',
        ':create-neoforge-1.21.1',
        ':touch-n-motion-neoforge-1.21.1',
        ':nea-neoforge-1.21.1',
        ':takeaseat-neoforge-1.21.1'
    ]

    aeronauticsModules.each { path ->
        dependsOn("${path}:assemble")
    }

    def uploadDir = file("upload/Aeronautics/neoforge-1.21.1")
    doFirst {
        delete fileTree(uploadDir).matching { include '*.jar' }
    }

    aeronauticsModules.each { path ->
        def p = project(path)
        def jarTask = p.tasks.jar
        def modId = p.findProperty('mod_id')
        def mcVersion = p.findProperty('minecraft_version')
        def modVersion = p.findProperty('mod_version')
        def suffix = (modId != null && modId.startsWith('emf_compat_')) ? modId.substring('emf_compat_'.length()) : jarTask.archiveBaseName.get()

        from(jarTask.archiveFile) {
            if (mcVersion != null && modVersion != null) {
                def own = modId != null && !modId.startsWith('emf_compat_')
                rename { own ? "${modId}_neoforge_${mcVersion}_${modVersion}.jar" : "emf_compat_${suffix}_neoforge_${mcVersion}_${modVersion}.jar" }
            }
        }
    }

    into uploadDir
}
