include("better-combat-forge-1.20.1")
project(":better-combat-forge-1.20.1").projectDir = file("extensions/better_combat/forge/1.20.1")

// Better Combat on Fabric 1.21.1 sits outside the Stonecutter branch below, and outside the
// usual <addon>/<loader>/<version> layout, because the branch root owns extensions/better_combat/fabric.
// It could not share that branch's sources anyway: 1.21.1 predates the render-state API, and Better
// Combat drives its animations through kosmx's Player Animator there rather than zigythebird's.
include("better-combat-fabric-1.21.1")
project(":better-combat-fabric-1.21.1").projectDir = file("extensions/better_combat/fabric-1.21.1")

// Better Combat, Fabric side — one Stonecutter branch instead of three flat modules.
// The sources of 1.21.11, 26.1.2 and 26.2 were byte-identical, so the branch carries a single
// src/ and needs no version directives at all; only the buildscript differs, and only because
// 1.21.x is obfuscated (fabric-loom-remap) while 26.x is not (fabric-loom).
include("better-combat-fabric")
project(":better-combat-fabric").projectDir = file("extensions/better_combat/fabric")

stonecutter {
    create(":better-combat-fabric") {
        version("1.21.11", "1.21.11").buildscript("build.remap.gradle")
        version("26.1.2", "26.1.2").buildscript("build.plain.gradle")
        version("26.2", "26.2").buildscript("build.plain.gradle")
        vcsVersion = "26.2"
    }
}

