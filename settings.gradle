// Touch'n Motion (was the Animation Additions addon).
// One Stonecutter tree for every loader and version: a single src/, kept in git as the NeoForge
// 1.21.1 node reads it. Nodes are named "<minecraft>-<loader>"; each loader has a buildscript.
include("touch-n-motion")
project(":touch-n-motion").projectDir = file("extensions/touch_n_motion")
stonecutter {
    create(":touch-n-motion") {
        version("1.20.1-forge", "1.20.1").buildscript("build.forge.gradle")
        version("1.21.1-neoforge", "1.21.1").buildscript("build.neoforge.gradle")
        version("1.21.1-fabric", "1.21.1").buildscript("build.fabric.remap.gradle")
        version("1.21.11-fabric", "1.21.11").buildscript("build.fabric.remap.gradle")
        version("26.1.2-fabric", "26.1.2").buildscript("build.fabric.gradle")
        version("26.2-fabric", "26.2").buildscript("build.fabric.gradle")
        version("26.3-fabric", "26.3").buildscript("build.fabric.gradle")
        vcsVersion = "1.21.1-neoforge"
    }
}

