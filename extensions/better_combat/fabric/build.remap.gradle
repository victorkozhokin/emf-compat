// Better Combat addon — Minecraft 1.21.x on Fabric.
//
// 1.21.x is still obfuscated, so this half needs fabric-loom-remap, an explicit mappings line
// and mod* dependency scopes, and its final artefact comes out of remapJar rather than jar.
// Everything below the dependency block is identical to build.plain.gradle on purpose — the two
// files exist only because a plugins {} block cannot pick its plugin id per version.

plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.11'
    id 'maven-publish'
}

apply from: rootProject.file('extensions/better_combat/fabric/versions.gradle')

def mc = ext.mc()

// mod_version has to be an ext property, not just `version`: the root build script reads
// it back with findProperty to name the uploaded jar, and without it the module would
// inherit the 1.0.0 default from the root gradle.properties.
ext.mod_version = '2.1.2'
version = mod_version
group = mod_group_id

ext.mod_id = 'emf_compat_better_combat'
ext.mod_name = 'EMF Compat: Better Combat'
ext.mod_description = 'Restores Better Combat attack poses after EMF animation, so weapon swing animations are not overwritten by Entity Model Features.'
// The root build script reads this to name the uploaded jar; on a flat module it comes
// from gradle.properties, here it is whichever version node is being built.
ext.minecraft_version = stonecutter.current.version

base {
    archivesName = mod_id
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.redlance.org/public' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${mc.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric_version}"
    modImplementation project(mc.core)

    modCompileOnly mc.emf
    modCompileOnly mc.etf
    modCompileOnly mc.betterCombat
    modCompileOnly mc.pal
}

processResources {
    // The addon ships its own copies of two Better Combat animations.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    def props = [
            "version"          : version,
            "minecraft_version": stonecutter.current.version,
            "loader_version"   : mc.loader_version,
            "mod_id"           : mod_id,
            "mod_name"         : mod_name,
            "mod_description"  : mod_description,
            "mod_authors"      : mod_authors,
            "mod_license"      : mod_license,
    ]
    props.each { k, v -> inputs.property(k, v) }
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(props)
    }
}

def targetJavaVersion = mc.java
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
