// Names the game changed between versions, replaced in the sources of the nodes they hold for.
// The sources in git carry the 1.21.1 names. What changed more than its name is not here: that
// is in strm.touchnmotion.platform.Platform, or under a condition where it is used.
//
// A replacement works both ways: a node of the older span gets the newer name put back. So only
// names that mean the same on both sides are here - never one that is also a different thing's
// name on the other side (isInWater, PlayerModel).

def since = { String version -> stonecutter.eval(stonecutter.current.version, ">=" + version) }

stonecutter.replacements {
    def modern = since('1.21.11')
    [
        'world.entity.animal.horse.'               : 'world.entity.animal.equine.',
        'world.entity.animal.Cow'                  : 'world.entity.animal.cow.Cow',
        'world.entity.vehicle.AbstractMinecart'    : 'world.entity.vehicle.minecart.AbstractMinecart',
        'world.entity.npc.AbstractVillager'        : 'world.entity.npc.villager.AbstractVillager',
        'client.model.PlayerModel'                 : 'client.model.player.PlayerModel',
        'world.entity.vehicle.Boat'                : 'world.entity.vehicle.boat.AbstractBoat',
        'world.entity.vehicle.ChestBoat'           : 'world.entity.vehicle.boat.AbstractChestBoat',
        '.getNormal()'                             : '.getUnitVec3i()',
    ].each { from, to ->
        string(modern) { replace(from, to) }
    }
    regex(modern) { replace('\\bResourceLocation\\b', 'Identifier', '\\bIdentifier\\b', 'ResourceLocation') }
    def deobf = since('26.1')
    [
        'client.renderer.state.CameraRenderState'  : 'client.renderer.state.level.CameraRenderState',
        'client/renderer/state/CameraRenderState'  : 'client/renderer/state/level/CameraRenderState',
        '.playC2S()'                               : '.serverboundPlay()',
        '.playS2C()'                               : '.clientboundPlay()',
    ].each { from, to ->
        string(deobf) { replace(from, to) }
    }
    string(since('26.3')) { replace('.getAttackAnim(', '.getSwingAnimation(') }
    string(since('1.20.5')) { replace('EnchantmentTableBlock', 'EnchantingTableBlock') }
    // Every boat was a Boat; now a Boat is one kind of AbstractBoat.
    regex(modern) { replace('\\bBoat\\b(?!\\.Type)', 'AbstractBoat', '\\bAbstractBoat\\b', 'Boat') }
    regex(modern) { replace('\\bChestBoat\\b', 'AbstractChestBoat', '\\bAbstractChestBoat\\b', 'ChestBoat') }
}
