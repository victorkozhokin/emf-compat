// Touch'n Motion: what differs from one node of the Stonecutter tree to the next.
//
// A node is named "<minecraft>-<loader>". The tree's sources live in src/ and are kept in git
// as the NeoForge 1.21.1 node reads them; versions/ is generated and ignored, so nothing a node
// needs can live in a gradle.properties there - it is all here.
//
// span: the game's way of drawing an entity - 'legacy' up to 1.21.10 (the renderer animates and
// draws at once), 'modern' from 1.21.11 (a render state, drawn later). It picks the mixins.

ext.tnm = [
    mod_id         : 'touch_n_motion',
    mod_name       : "Touch'n Motion",
    mod_version    : '1.0.0',
    mod_license    : 'GNU GPL 3.0',
    mod_authors    : 'STRadaT',
    mod_description: "Procedural additions to the player's animation under Entity Model Features: feet that stand on uneven ground, hands that go to walls, plants, buttons, doors and the blocks they use, a torso that leans with the motion, a rider that follows an animated horse.",
    root           : rootProject.file('extensions/touch_n_motion'),
]

ext.tnmNodes = [
    '1.21.1-neoforge': [
        loader                 : 'neoforge',
        span                   : 'legacy',
        core                   : ':core-neoforge-1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neo_version            : '21.1.230',
        neo_version_range      : '[21,)',
        loader_version_range   : '[4,)',
        emf                    : 'maven.modrinth:entity-model-features:3.3.2-neoforge-1.21',
        etf                    : 'maven.modrinth:entitytexturefeatures:7.2.1-neoforge-1.21',
    ],
    '1.20.1-forge': [
        loader                 : 'forge',
        span                   : 'legacy',
        // Blocks this version of the game does not have yet.
        excludes               : ['**/blockuse/vanilla/Crafter.java', '**/blockuse/vanilla/Vault.java'],
        // No place in this version's code to hook: the fishing line's end is not a method.
        dropMixins             : ['FishingLineMixin'],
        core                   : ':core-forge-1.20.1',
        minecraft_version_range: '[1.20.1,1.20.2)',
        forge_version          : '47.3.0',
        forge_version_range    : '[47,)',
        loader_version_range   : '[47,)',
        emf                    : 'maven.modrinth:entity-model-features:3.3.2-forge-1.20.1',
        etf                    : 'maven.modrinth:entitytexturefeatures:7.2.1-forge-1.20.1',
    ],
    '1.21.1-fabric': [
        loader         : 'fabric',
        span           : 'legacy',
        java           : 21,
        core           : ':core-fabric-1.21.1',
        loader_version : '0.16.14',
        fabric_version : '0.116.17+1.21.1',
        modmenu_version: '11.0.4',
        emf_version    : '3.3.2',
        emf            : 'maven.modrinth:entity-model-features:3.3.2-fabric-1.21',
        etf            : 'maven.modrinth:entitytexturefeatures:7.2.1-fabric-1.21',
    ],
    '1.21.11-fabric': [
        loader         : 'fabric',
        span           : 'modern',
        java           : 21,
        core           : ':core-fabric-1.21.11',
        loader_version : '0.19.2',
        fabric_version : '0.141.4+1.21.11',
        modmenu_version: '17.0.0',
        emf_version    : '3.3.2',
        emf            : 'maven.modrinth:entity-model-features:3.3.2-fabric-1.21.11',
        etf            : 'maven.modrinth:entitytexturefeatures:7.2.1-fabric-1.21.11',
    ],
    '26.1.2-fabric': [
        loader         : 'fabric',
        span           : 'modern',
        java           : 25,
        core           : ':core-fabric-26.1.2',
        loader_version : '0.19.2',
        fabric_version : '0.148.2+26.1.2',
        modmenu_version: '18.0.0-beta.1',
        emf_version    : '3.3.2',
        emf            : 'maven.modrinth:entity-model-features:3.3.2-fabric-26.1',
