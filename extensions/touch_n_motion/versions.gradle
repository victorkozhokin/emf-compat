    ],
]

// The node being built: its own values over the mod's.
ext.node = { ->
    def values = tnmNodes[project.name]
    if (values == null) {
        throw new GradleException("No Touch'n Motion values for node ${project.name} in versions.gradle")
    }
    return tnm + values
}

// What Stonecutter is told of a node, the same for every buildscript: the loader as a constant
// for the conditions in the sources (//? if fabric), and the names the game changed, replaced
// throughout instead of a condition at every use.
ext.tnmStonecutter = { values ->
    stonecutter.constants.match(values.loader, 'fabric', 'neoforge', 'forge')
    apply from: rootProject.file('extensions/touch_n_motion/renames.gradle')
}
