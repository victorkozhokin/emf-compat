plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

// Touch'n Motion on NeoForge. One buildscript per loader: a plugins {} block cannot pick its
// plugins by node. What differs between nodes of one loader is in versions.gradle.
apply from: rootProject.file('extensions/touch_n_motion/versions.gradle')

def n = ext.node()

// The root build script reads these back with findProperty to name the uploaded jar.
ext.mod_id = n.mod_id
ext.mod_name = n.mod_name
ext.mod_version = n.mod_version
ext.minecraft_version = stonecutter.current.version

version = mod_version
group = mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = n.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

ext.tnmStonecutter(n)

// The other loaders' own parts are not this build's, nor those of the other span of versions.
sourceSets.main.java.exclude '**/fabric/**', '**/forge/**', n.span == 'modern' ? '**/legacy/**' : '**/modern/**'
sourceSets.main.resources {
    srcDir new File(n.root, 'platform/neoforge/resources')
    srcDir new File(n.root, "platform/neoforge-${n.span}/resources")
}

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation project(n.core)
    compileOnly n.emf
    compileOnly n.etf

    // Unit tests of the pure logic (the interaction arbiter, smoothing): no game needed.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.joml:joml:1.10.5' // Verify IK against the renderer's quaternion transform.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: n.minecraft_version_range,
                             neo_version            : n.neo_version,
                             neo_version_range      : n.neo_version_range,
                             loader_version_range   : n.loader_version_range,
                             mod_id                 : n.mod_id,
                             mod_name               : n.mod_name,
                             mod_license            : n.mod_license,
                             mod_version            : n.mod_version,
                             mod_authors            : n.mod_authors,
                             mod_description        : n.mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from new File(n.root, "platform/neoforge/templates")
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
