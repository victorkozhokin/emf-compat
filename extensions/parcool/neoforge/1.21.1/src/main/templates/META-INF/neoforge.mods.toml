modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile = "icon.png"
description='''
${mod_description}
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

# 3.4.0.0 is the first release with the client Animation attachment the 3.x capture path
# hooks; the 4.x path needs 4.0.0.0. One range covers both, the mixin plugin picks the path.
[[dependencies.${mod_id}]]
modId="parcool"
type="required"
versionRange="[3.4.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emf_compat_core"
type="required"
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="required"
versionRange="[3.2.4,)"
ordering="AFTER"
side="CLIENT"
