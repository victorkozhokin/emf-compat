modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile = "icon.png"
description='''
${mod_description}
'''

[[mixins]]
config="emf_compat_create.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="[6.0.8,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emf_compat_core"
mandatory=true
versionRange="[2.3.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
mandatory=true
versionRange="[3.3.2,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="create_sa"
mandatory=false
versionRange="[2.1.2,)"
ordering="AFTER"
side="CLIENT"
