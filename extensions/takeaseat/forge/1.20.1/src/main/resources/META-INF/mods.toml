modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile = "icon.png"
description='''
${mod_description}
'''

[[mixins]]
config="emf_compat_takeaseat.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

# Sitting+ is the 1.20.1 target (Take a Seat is a fork of it and has no 1.20.1 build).
# 2.0.2 is the first release under this mod id — 2.0.1 and older are "sitmod", and they
# also register their animations under a different namespace than SittingPlusCompat matches.
[[dependencies.${mod_id}]]
modId="sittingplus"
mandatory=true
versionRange="[2.0.2,)"
ordering="AFTER"
side="CLIENT"

# Sitting+ drives its poses through Player Animator but declares no dependency on it, and our
# accessors mix into its classes — without it the mixin fails instead of reporting a missing mod.
# The bound stays below 1.0.2 on purpose: "1.0.2-rc1+1.20" sorts under 1.0.2 as a release candidate.
[[dependencies.${mod_id}]]
modId="playeranimator"
mandatory=true
versionRange="[1.0.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emf_compat_core"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
mandatory=true
versionRange="[3.2.4,)"
ordering="AFTER"
side="CLIENT"
